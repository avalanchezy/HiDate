[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hidate"
version = "1.0.0"
description = "Historical relevance and date-grounded legal evidence retrieval"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
models = ["torch==2.5.0", "transformers==4.57.6", "accelerate==1.12.0"]
ranking = ["lightgbm==4.6.0", "scikit-learn==1.7.2"]
japanese = ["fugashi==1.5.2", "unidic-lite==1.0.8", "sentencepiece==0.2.1"]
evaluation = ["sacrebleu==2.5.1"]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
